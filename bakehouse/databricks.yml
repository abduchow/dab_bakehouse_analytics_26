# This is a Databricks asset bundle definition for bakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse
  uuid: e000c46d-9ae6-42f7-a1ce-51f995edf48e

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b14c7cf0-06ce.cloud.databricks.com
    variables:
      catalog: bakehouse_dev
      schema: rnd
  prod:
    mode: production
    workspace:
      host: https://dbc-b14c7cf0-06ce.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/abduchow@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/abduchow@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_dev
      schema: rnd
    permissions:
      - user_name: abduchow@gmail.com
        level: CAN_MANAGE
